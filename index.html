<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>jihan park</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23111827'/></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Geist', 'system-ui', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <style>
    body {
      font-family: 'Geist', system-ui, sans-serif;
      font-weight: 500;
      font-size: 13px;
      line-height: 1.6;
      letter-spacing: 0.04em;
      color: #1A1A1A;
      overflow: hidden;
    }

    a {
      text-decoration: none;
      transition: background-color 0.15s ease;
      border-radius: 2px;
      padding: 1px 4px;
      margin: -1px -4px;
    }

    a:hover {
      background-color: #FEF9C3;
    }

    /* Spring physics transition */
    .window-transition {
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Minimized state */
    .window-minimized {
      transform: translateY(calc(100vh - 40px)) scale(0.6);
      pointer-events: none;
    }

    /* Minimized title bar at bottom */
    .dock-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%) translateY(100%);
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      z-index: 50;
    }

    .dock-bar.visible {
      transform: translateX(-50%) translateY(0);
    }

    /* Newsletter card */
    .newsletter-card {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 40;
    }

    .newsletter-card.visible {
      opacity: 1;
      pointer-events: auto;
    }

    /* Newsletter input */
    .newsletter-input {
      border: none;
      border-bottom: 1px solid #E5E5E5;
      outline: none;
      background: transparent;
      font-family: 'Geist', system-ui, sans-serif;
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 0.04em;
      color: #1A1A1A;
      padding: 8px 0;
      width: 100%;
    }

    .newsletter-input::placeholder {
      color: #999999;
    }

    .newsletter-input:focus {
      border-bottom-color: #1A1A1A;
    }

    /* Traffic light buttons */
    .traffic-light {
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    .traffic-light:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body class="min-h-screen bg-[#f5f5f1] flex items-center justify-center p-4 sm:p-8">

  <!-- Floating Window -->
  <div id="mainWindow" class="w-full max-w-[580px] bg-white border border-[#E5E5E5] rounded-lg shadow-[0_8px_30px_rgba(0,0,0,0.08)] window-transition">

    <!-- Header Bar with Traffic Lights -->
    <div class="px-4 py-3 border-b border-[#E5E5E5] flex items-center">
      <div class="flex items-center gap-2">
        <span class="w-3 h-3 rounded-full bg-[#FF5F56] inline-block traffic-light" onclick="minimizeWindow()"></span>
        <span class="w-3 h-3 rounded-full bg-[#FFBD2E] inline-block traffic-light" onclick="minimizeWindow()"></span>
        <span class="w-3 h-3 rounded-full bg-[#27C93F] inline-block traffic-light" onclick="restoreWindow()"></span>
      </div>
    </div>

    <!-- Email Header Rows -->
    <div class="px-6 sm:px-8">
      <!-- FROM -->
      <div class="flex py-3 border-b border-[#E5E5E5]">
        <span class="text-[#666666] text-[13px] uppercase tracking-[0.06em] w-24 shrink-0 pt-[1px]">From</span>
        <span class="text-[13px] text-[#1A1A1A] uppercase tracking-[0.06em]">JIHAN PARK</span>
      </div>
      <!-- TO -->
      <div class="flex py-3 border-b border-[#E5E5E5]">
        <span class="text-[#666666] text-[13px] uppercase tracking-[0.06em] w-24 shrink-0 pt-[1px]">To</span>
        <span class="text-[13px] text-[#1A1A1A] uppercase tracking-[0.06em]">YOU</span>
      </div>
      <!-- SUBJECT -->
      <div class="flex py-3 border-b border-[#E5E5E5]">
        <span class="text-[#666666] text-[13px] uppercase tracking-[0.06em] w-24 shrink-0 pt-[1px]">Subject</span>
        <span class="text-[13px] text-[#1A1A1A] uppercase tracking-[0.06em]">HI, HERE'S WHO I AM</span>
      </div>
    </div>

    <!-- Email Body -->
    <div class="px-6 sm:px-8 pt-[24px] pb-6 sm:pb-8 space-y-5">

      <!-- FOUNDER -->
      <div class="flex flex-col sm:flex-row gap-1 sm:gap-0">
        <span class="text-[#666666] text-[13px] uppercase tracking-[0.06em] w-24 shrink-0 pt-[1px]">Founder</span>
        <div class="text-[13px] text-[#1A1A1A] leading-[1.6] uppercase tracking-[0.06em]">
          <div>CURRENT CONSULTING</div>
          <div>RIMA</div>
        </div>
      </div>

      <!-- UPCOMING -->
      <div class="flex flex-col sm:flex-row gap-1 sm:gap-0">
        <span class="text-[#666666] text-[13px] uppercase tracking-[0.06em] w-24 shrink-0 pt-[1px]">Upcoming</span>
        <span class="text-[13px] text-[#1A1A1A] leading-[1.6] uppercase tracking-[0.06em]">LIKEWISE</span>
      </div>

      <!-- PREVIOUS -->
      <div class="flex flex-col sm:flex-row gap-1 sm:gap-0">
        <span class="text-[#666666] text-[13px] uppercase tracking-[0.06em] w-24 shrink-0 pt-[1px]">Previous</span>
        <span class="text-[13px] text-[#1A1A1A] leading-[1.6] uppercase tracking-[0.06em]">MONOGEN</span>
      </div>

      <!-- VISION -->
      <div class="flex flex-col sm:flex-row gap-1 sm:gap-0">
        <span class="text-[#666666] text-[13px] uppercase tracking-[0.06em] w-24 shrink-0 pt-[1px]">Vision</span>
        <span class="text-[13px] text-[#1A1A1A] leading-[1.6] uppercase tracking-[0.06em]">PROVE TO THE WORLD THAT SUCCESS CAN BE QUIET AND HEALTHY</span>
      </div>

      <!-- CONTACT -->
      <div class="flex flex-col sm:flex-row gap-1 sm:gap-0">
        <span class="text-[#666666] text-[13px] uppercase tracking-[0.06em] w-24 shrink-0 pt-[1px]">Contact</span>
        <div class="text-[13px] text-[#1A1A1A] leading-[1.6] uppercase tracking-[0.06em] flex flex-wrap gap-x-4 gap-y-1">
          <a href="https://x.com/jihanparks" target="_blank" rel="noopener noreferrer" class="text-[#1A1A1A]">X ↗</a>
          <a href="https://www.instagram.com/builtbyjihan/" target="_blank" rel="noopener noreferrer" class="text-[#1A1A1A]">Instagram ↗</a>
          <a href="https://www.youtube.com/@jihanpark01" target="_blank" rel="noopener noreferrer" class="text-[#1A1A1A]">YouTube ↗</a>
        </div>
      </div>

      <!-- Signature -->
      <div class="mt-8">
        <img src="Jihan.png" alt="Jihan" style="height: 28px !important; max-height: 28px; width: auto;" />
      </div>

    </div>

  </div>

  <!-- Newsletter Card (hidden by default) -->
  <div id="newsletterCard" class="newsletter-card w-full max-w-[400px] px-6">
    <div class="text-center">
      <p class="text-[13px] text-[#1A1A1A] leading-[1.8] mb-8">i write a weekly note on quiet success.<br>join 2,400+ builders.</p>
      <div class="flex items-center gap-3">
        <input type="email" placeholder="your email" class="newsletter-input flex-1" />
        <button onclick="return" class="bg-[#1A1A1A] text-white text-[13px] font-medium tracking-[0.06em] px-5 py-2 rounded cursor-pointer hover:bg-[#333] transition-colors">join</button>
      </div>
    </div>
  </div>

  <!-- Dock Bar (hidden by default) -->
  <div id="dockBar" class="dock-bar" onclick="restoreWindow()">
    <div class="bg-white border border-[#E5E5E5] rounded-t-lg shadow-[0_-4px_20px_rgba(0,0,0,0.06)] px-5 py-2 flex items-center gap-3">
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-[#FF5F56] inline-block"></span>
        <span class="w-2.5 h-2.5 rounded-full bg-[#FFBD2E] inline-block"></span>
        <span class="w-2.5 h-2.5 rounded-full bg-[#27C93F] inline-block"></span>
      </div>
      <span class="text-[11px] text-[#666666] uppercase tracking-[0.1em] ml-1">jihan park</span>
    </div>
  </div>

  <script>
    const mainWindow = document.getElementById('mainWindow');
    const newsletterCard = document.getElementById('newsletterCard');
    const dockBar = document.getElementById('dockBar');
    let isMinimized = false;

    function minimizeWindow() {
      if (isMinimized) return;
      isMinimized = true;
      mainWindow.classList.add('window-minimized');
      setTimeout(() => {
        newsletterCard.classList.add('visible');
        dockBar.classList.add('visible');
      }, 150);
    }

    function restoreWindow() {
      if (!isMinimized) return;
      isMinimized = false;
      newsletterCard.classList.remove('visible');
      dockBar.classList.remove('visible');
      setTimeout(() => {
        mainWindow.classList.remove('window-minimized');
      }, 100);
    }
  </script>

</body>
</html>
