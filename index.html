<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jihan Park</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            mono: ['"JetBrains Mono"', 'Courier New', 'monospace'],
          },
        },
      },
    }
  </script>
  <style>
    body {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
    }

    a {
      text-decoration: none;
      transition: background-color 0.15s ease;
      border-radius: 2px;
      padding: 1px 4px;
      margin: -1px -4px;
    }

    a:hover {
      background-color: #FEF9C3;
    }
  </style>
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center p-4 sm:p-8">

  <!-- Floating Window -->
  <div class="w-full max-w-[700px] bg-white border border-[#E5E5E5] rounded-lg shadow-[0_8px_30px_rgba(0,0,0,0.08)]">

    <!-- Header Bar with Traffic Lights -->
    <div class="px-4 py-3 border-b border-[#E5E5E5] flex items-center">
      <div class="flex items-center gap-2">
        <span class="w-3 h-3 rounded-full bg-[#FF5F56] inline-block"></span>
        <span class="w-3 h-3 rounded-full bg-[#FFBD2E] inline-block"></span>
        <span class="w-3 h-3 rounded-full bg-[#27C93F] inline-block"></span>
      </div>
    </div>

    <!-- Email Header Rows -->
    <div class="px-6 sm:px-8">
      <!-- FROM -->
      <div class="flex py-3 border-b border-[#E5E5E5]">
        <span class="text-[#888888] text-xs uppercase tracking-wider font-mono w-24 shrink-0 pt-[2px]">From</span>
        <span class="text-sm font-medium text-gray-900">JIHAN PARK</span>
      </div>
      <!-- TO -->
      <div class="flex py-3 border-b border-[#E5E5E5]">
        <span class="text-[#888888] text-xs uppercase tracking-wider font-mono w-24 shrink-0 pt-[2px]">To</span>
        <span class="text-sm font-medium text-gray-900">YOU</span>
      </div>
      <!-- SUBJECT -->
      <div class="flex py-3 border-b border-[#E5E5E5]">
        <span class="text-[#888888] text-xs uppercase tracking-wider font-mono w-24 shrink-0 pt-[2px]">Subject</span>
        <span class="text-sm font-medium text-gray-900">HI, HERE'S WHO I AM</span>
      </div>
    </div>

    <!-- Email Body -->
    <div class="px-6 sm:px-8 py-6 sm:py-8 space-y-5">

      <!-- FOUNDER -->
      <div class="flex flex-col sm:flex-row gap-1 sm:gap-0">
        <span class="text-[#888888] text-xs uppercase tracking-wider font-mono w-24 shrink-0 pt-[3px]">Founder</span>
        <div class="text-sm text-gray-900 leading-relaxed">
          <div>CURRENT CONSULTING</div>
          <div>RIMA</div>
        </div>
      </div>

      <!-- UPCOMING -->
      <div class="flex flex-col sm:flex-row gap-1 sm:gap-0">
        <span class="text-[#888888] text-xs uppercase tracking-wider font-mono w-24 shrink-0 pt-[3px]">Upcoming</span>
        <span class="text-sm text-gray-900 leading-relaxed">LIKEWISE</span>
      </div>

      <!-- PREVIOUS -->
      <div class="flex flex-col sm:flex-row gap-1 sm:gap-0">
        <span class="text-[#888888] text-xs uppercase tracking-wider font-mono w-24 shrink-0 pt-[3px]">Previous</span>
        <span class="text-sm text-gray-900 leading-relaxed">MONOGEN</span>
      </div>

      <!-- VISION -->
      <div class="flex flex-col sm:flex-row gap-1 sm:gap-0">
        <span class="text-[#888888] text-xs uppercase tracking-wider font-mono w-24 shrink-0 pt-[3px]">Vision</span>
        <span class="text-sm text-gray-900 leading-relaxed">PROVE TO THE WORLD THAT SUCCESS CAN BE QUIET AND HEALTHY</span>
      </div>

      <!-- CONTACT -->
      <div class="flex flex-col sm:flex-row gap-1 sm:gap-0">
        <span class="text-[#888888] text-xs uppercase tracking-wider font-mono w-24 shrink-0 pt-[3px]">Contact</span>
        <div class="text-sm text-gray-900 leading-relaxed flex flex-wrap gap-x-4 gap-y-1">
          <a href="https://x.com" class="text-gray-900">X ↗</a>
          <a href="https://instagram.com" class="text-gray-900">Instagram ↗</a>
          <a href="mailto:hello@example.com" class="text-gray-900">Email ↗</a>
        </div>
      </div>

      <!-- Signature -->
      <div class="pt-4">
        <p class="text-sm text-gray-500 italic">— Jihan</p>
      </div>

    </div>

  </div>

</body>
</html>
